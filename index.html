<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMENTED_AVIAN // GITHUB TERMINAL PAGE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --neon-blue: #0ff0fc;
            --neon-pink: #ff2a6d;
            --neon-purple: #d300c5;
            --dark-bg: #0d0221;
            --darker-bg: #060014;
            --terminal-green: #00ff41;
            --github-purple: #6e40c9;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--dark-bg);
            color: var(--neon-blue);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(
                    rgba(0, 255, 65, 0.03) 50%, 
                    rgba(0, 0, 0, 0.1) 50%
                );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }
        
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABOSURBVGhDY/j//z8Druzg4MDAyMj4H4j/gzAQg+RAmJWV9T8Q/wdhkByQHqQHqQfqQepF6kVikByQHqQHqQfqQepF6kVikByQHqQHqQcA7S0QpUZ8X5QAAAAASUVORK5CYII=');
            opacity: 0.03;
            pointer-events: none;
            z-index: 99;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        
        .terminal {
            width: 90%;
            max-width: 800px;
            height: 500px;
            background-color: rgba(13, 2, 33, 0.7);
            border: 1px solid var(--github-purple);
            box-shadow: 0 0 20px rgba(110, 64, 201, 0.3),
                        inset 0 0 20px rgba(110, 64, 201, 0.2);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        
        .terminal-header {
            height: 30px;
            background: linear-gradient(90deg, var(--github-purple), #3a1b6f);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.8rem;
            color: white;
        }
        
        .terminal-body {
            padding: 1.5rem;
            height: calc(100% - 30px);
            overflow-y: auto;
        }
        
        .prompt {
            display: flex;
            margin-bottom: 1rem;
            align-items: center;
        }
        
        .prompt-user {
            color: var(--terminal-green);
            margin-right: 0.5rem;
        }
        
        .prompt-path {
            color: var(--neon-blue);
            margin-right: 0.5rem;
        }
        
        .command {
            color: white;
            flex-grow: 1;
        }
        
        .output {
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        .avatar-container {
            display: flex;
            margin-bottom: 1.5rem;
            align-items: center;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--github-purple), #3a1b6f);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 1.5rem;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(110, 64, 201, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .avatar::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(
                    circle at 30% 30%,
                    rgba(255, 255, 255, 0.3) 0%,
                    transparent 50%
                );
        }
        
        .avatar-initials {
            font-size: 3rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.7);
        }
        
        .info-text {
            flex-grow: 1;
        }
        
        .neon-text {
            text-shadow: 0 0 5px var(--neon-blue),
                         0 0 10px var(--neon-blue),
                         0 0 15px var(--neon-blue);
            color: var(--neon-blue);
        }
        
        .pink-text {
            color: var(--neon-pink);
        }
        
        .green-text {
            color: var(--terminal-green);
        }
        
        .purple-text {
            color: var(--github-purple);
        }
        
        .typing {
            border-right: 2px solid var(--neon-blue);
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--neon-blue); }
        }
        
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .repo-card {
            background: rgba(110, 64, 201, 0.1);
            border: 1px solid var(--github-purple);
            border-radius: 5px;
            padding: 1rem;
            transition: all 0.3s;
        }
        
        .repo-card:hover {
            background: rgba(110, 64, 201, 0.2);
            box-shadow: 0 0 10px rgba(110, 64, 201, 0.5);
            transform: translateY(-3px);
        }
        
        .repo-name {
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .repo-desc {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 0.5rem;
        }
        
        .repo-stats {
            display: flex;
            font-size: 0.8rem;
            color: var(--terminal-green);
        }
        
        .repo-stat {
            margin-right: 1rem;
            display: flex;
            align-items: center;
        }
        
        .repo-stat i {
            margin-right: 0.3rem;
        }
        
        .command-input {
            display: flex;
            margin-top: 1rem;
        }
        
        #user-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--github-purple);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            padding: 0.3rem;
            flex-grow: 1;
            outline: none;
        }
        
        #user-input:focus {
            border-bottom: 1px solid var(--neon-pink);
        }
        
        ::selection {
            background: var(--github-purple);
            color: white;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(110, 64, 201, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--github-purple);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-pink);
        }
        
        .github-corner {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 1000;
        }
        
        .github-corner svg {
            fill: var(--github-purple);
            color: var(--dark-bg);
        }
        
        .github-corner:hover .octo-arm {
            animation: octocat-wave 560ms ease-in-out;
        }
        
        @keyframes octocat-wave {
            0%, 100% { transform: rotate(0); }
            20%, 60% { transform: rotate(-25deg); }
            40%, 80% { transform: rotate(10deg); }
        }
    </style>
</head>
<body>
    <div class="matrix-rain" id="matrixRain"></div>
    <div class="noise"></div>
    <div class="scanlines"></div>
    
    <a href="https://github.com/dementedavians" class="github-corner" aria-label="View source on GitHub">
        <svg width="80" height="80" viewBox="0 0 250 250" style="fill:var(--github-purple); color:var(--dark-bg); position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
        </svg>
    </a>
    
    <div class="container">
        <div class="terminal">
            <div class="terminal-header">
                DEMENTED_AVIANS.exe - Terminal v6.9.4.2.0
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="prompt">
                    <span class="prompt-user green-text">user@dementedavians</span>
                    <span class="prompt-path neon-text">~/github/terminal</span>
                    <span class="command pink-text">$ ./init_profile.sh</span>
                </div>
                
                <div class="output">
                    <div class="avatar-container">
                        <div class="avatar">
                            <div class="avatar-initials">DA</div>
                        </div>
                        <div class="info-text">
                            <h1 class="neon-text">DEMENTED AVIANS</h1>
                            <p class="green-text">> The best github org</p>
                            <p class="purple-text">> Bird Enthusiasts</p>
                            <p>> Open Source Contributor</p>
                        </div>
                    </div>
                    
                    <p class="green-text">SYSTEM INITIALIZATION COMPLETE</p>
                    <p>LOADING GITHUB PROFILE DATA...</p>
                    <p class="typing" id="typingText"></p>
                    
                    <div class="repo-grid" id="repoGrid">
                    </div>
                </div>
                
                <div class="command-input">
                    <span class="prompt-user green-text">user@dementedavians</span>
                    <span class="prompt-path neon-text">~/github/terminal</span>
                    <span class="command">$</span>
                    <input type="text" id="user-input" autofocus placeholder="Type 'help' for commands">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const matrixRain = document.getElementById('matrixRain');
            const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
            
            function createMatrix() {
                const columns = Math.floor(window.innerWidth / 20);
                for (let i = 0; i < columns; i++) {
                    const column = document.createElement('div');
                    column.style.position = 'absolute';
                    column.style.top = '-50px';
                    column.style.left = (i * 20) + 'px';
                    column.style.width = '2px';
                    column.style.height = '100%';
                    column.style.color = '#6e40c9';
                    column.style.fontSize = '15px';
                    column.style.opacity = '0.7';
                    column.style.textAlign = 'center';
                    matrixRain.appendChild(column);
                    
                    animateColumn(column);
                }
            }
            
            function animateColumn(column) {
                const charCount = Math.floor(Math.random() * 10) + 10;
                let charsDrawn = 0;
                let delay = Math.random() * 3000;
                
                const interval = setInterval(() => {
                    if (charsDrawn < charCount) {
                        const char = document.createElement('span');
                        char.textContent = chars.charAt(Math.floor(Math.random() * chars.length));
                        char.style.opacity = '0';
                        char.style.transition = 'opacity 0.3s';
                        column.appendChild(char);
                        
                        setTimeout(() => {
                            char.style.opacity = '1';
                        }, 10);
                        
                        setTimeout(() => {
                            char.style.opacity = '0';
                            setTimeout(() => {
                                if (column.contains(char)) {
                                    column.removeChild(char);
                                }
                            }, 300);
                        }, 2000);
                        
                        charsDrawn++;
                    } else {
                        clearInterval(interval);
                        setTimeout(() => {
                            animateColumn(column);
                        }, Math.random() * 5000);
                    }
                }, 100);
            }
            
            createMatrix();
            
            const typingText = document.getElementById('typingText');
            const messages = [
                "> Fetching repository data from GitHub API...",
                "> Analyzing commit history...",
                "> Calculating code contributions...",
                "> Loading repository information...",
                "> Establishing secure connection to GitHub...",
                "> Preparing repository display..."
            ];
            
            let messageIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            
            function type() {
                const currentMessage = messages[messageIndex];
                
                if (isDeleting) {
                    typingText.textContent = currentMessage.substring(0, charIndex - 1);
                    charIndex--;
                } else {
                    typingText.textContent = currentMessage.substring(0, charIndex + 1);
                    charIndex++;
                }
                
                if (!isDeleting && charIndex === currentMessage.length) {
                    isDeleting = true;
                    setTimeout(type, 2000);
                } else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    messageIndex = (messageIndex + 1) % messages.length;
                    setTimeout(type, 500);
                } else {
                    const speed = isDeleting ? 50 : 100;
                    setTimeout(type, speed);
                }
            }
            
            setTimeout(type, 1000);
            
            const repoGrid = document.getElementById('repoGrid');
            
            async function loadRepos() {
                try {
                    const response = await fetch('https://api.github.com/users/dementedavians/repos?sort=updated');
                    const repos = await response.json();
                    
                    typingText.remove();
                    
                    repos.forEach(repo => {
                        const repoCard = document.createElement('div');
                        repoCard.className = 'repo-card';
                        repoCard.innerHTML = `
                            <div class="repo-name">${repo.name}</div>
                            <div class="repo-desc">${repo.description || 'No description provided'}</div>
                            <div class="repo-stats">
                                <div class="repo-stat">
                                    <i>★</i> ${repo.stargazers_count}
                                </div>
                                <div class="repo-stat">
                                    <i>⎇</i> ${repo.forks_count}
                                </div>
                                <div class="repo-stat">
                                    <i>⌨</i> ${repo.language || 'N/A'}
                                </div>
                            </div>
                        `;
                        
                        repoCard.addEventListener('click', () => {
                            window.open(repo.html_url, '_blank');
                        });
                        
                        repoGrid.appendChild(repoCard);
                    });
                    
                    const successMsg = document.createElement('p');
                    successMsg.className = 'green-text';
                    successMsg.textContent = `> Successfully loaded ${repos.length} repositories from GitHub`;
                    repoGrid.parentNode.insertBefore(successMsg, repoGrid);
                    
                } catch (error) {
                    console.error('Error loading repositories:', error);
                    
                    typingText.remove();
                    
                    const errorMsg = document.createElement('p');
                    errorMsg.className = 'pink-text';
                    errorMsg.textContent = '> Error loading repositories from GitHub. Showing sample data instead.';
                    repoGrid.parentNode.insertBefore(errorMsg, repoGrid);
                    
                    loadSampleRepos();
                }
            }
            
            function loadSampleRepos() {
                const sampleRepos = [
                    {
                        name: "dementedavians.github.io",
                        description: "Personal GitHub pages site",
                        stargazers_count: 0,
                        forks_count: 0,
                        language: "HTML",
                        html_url: "https://github.com/dementedavians/dementedavians.github.io"
                    },
                    {
                        name: "Discord-Bot",
                        description: "A Discord bot with various features",
                        stargazers_count: 0,
                        forks_count: 0,
                        language: "JavaScript",
                        html_url: "https://github.com/dementedavians/Discord-Bot"
                    },
                    {
                        name: "Python-Projects",
                        description: "Collection of Python projects",
                        stargazers_count: 0,
                        forks_count: 0,
                        language: "Python",
                        html_url: "https://github.com/dementedavians/Python-Projects"
                    }
                ];
                
                sampleRepos.forEach(repo => {
                    const repoCard = document.createElement('div');
                    repoCard.className = 'repo-card';
                    repoCard.innerHTML = `
                        <div class="repo-name">${repo.name}</div>
                        <div class="repo-desc">${repo.description || 'No description provided'}</div>
                        <div class="repo-stats">
                            <div class="repo-stat">
                                <i>★</i> ${repo.stargazers_count}
                            </div>
                            <div class="repo-stat">
                                <i>⎇</i> ${repo.forks_count}
                            </div>
                            <div class="repo-stat">
                                <i>⌨</i> ${repo.language || 'N/A'}
                            </div>
                        </div>
                    `;
                    
                    repoCard.addEventListener('click', () => {
                        window.open(repo.html_url, '_blank');
                    });
                    
                    repoGrid.appendChild(repoCard);
                });
            }
            
            const userInput = document.getElementById('user-input');
            const terminalBody = document.getElementById('terminalBody');
            
            userInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const command = userInput.value.trim();
                    userInput.value = '';
                    
                    if (command) {
                        const prompt = document.createElement('div');
                        prompt.className = 'prompt';
                        prompt.innerHTML = `
                            <span class="prompt-user green-text">user@dementedavian</span>
                            <span class="prompt-path neon-text">~/github/terminal</span>
                            <span class="command">$ ${command}</span>
                        `;
                        terminalBody.appendChild(prompt);
                        
                        const output = document.createElement('div');
                        output.className = 'output';
                        
                        if (command === 'help') {
                            output.innerHTML = `
                                <p>Available commands:</p>
                                <p class="green-text">about</p>
                                <p class="green-text">contact</p>
                                <p class="green-text">clear</p>
                            `;
                        } else if (command === 'about') {
                            output.innerHTML = `
                                <p>> DEMENTED AVIANS Profile</p>
                                <p class="purple-text">- Game Developers</p>
                                <p class="purple-text">- Bird Lovers</p>
                                <p class="purple-text">- Web Developers</p>
                                <p>> Visit our GitHub: <a href="https://github.com/dementedavians" target="_blank" style="color: var(--neon-blue);">github.com/dementedavians</a></p>
                            `;
                        } else if (command === 'contact') {
                            output.innerHTML = `
                                <p>> Contact options:</p>
                                <p class="pink-text">- GitHub: <a href="https://github.com/dementedavians" target="_blank" style="color: var(--neon-pink);">dementedavians</a></p>
                            `;
                        } else if (command === 'clear') {
                            const outputs = document.querySelectorAll('.output, .prompt');
                            outputs.forEach((el, index) => {
                                if (index > 0) {
                                    el.remove();
                                }
                            });
                            return;
                        } else {
                            output.innerHTML = `
                                <p class="pink-text">Command not found: ${command}</p>
                                <p>Type <span class="green-text">help</span> for available commands</p>
                            `;
                        }
                        
                        terminalBody.appendChild(output);
                        terminalBody.scrollTop = terminalBody.scrollHeight;
                    }
                }
            });
            
            setTimeout(loadRepos, 5000);
            
            let glitchInterval = setInterval(() => {
                if (Math.random() > 0.95) {
                    terminalBody.style.transform = 'translateX(' + (Math.random() * 6 - 3) + 'px)';
                    setTimeout(() => {
                        terminalBody.style.transform = 'translateX(0)';
                    }, 100);
                }
            }, 5000);
        });
    </script>
</body>
</html>
