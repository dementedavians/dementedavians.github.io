<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Interface</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    h1, p, button {
      transition: all 0.3s ease;
    }

    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1 id="title">Test Interface</h1>
  <p id="description">Welcome to our test site. Please click the button below to continue testing user interaction.</p>
  <button id="continueBtn">Continue</button>

  <script>
    let chaosLevel = parseInt(localStorage.getItem("chaos-level")) || 0;

    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const button = document.getElementById("continueBtn");

    function updateStyles() {
      const rotation = chaosLevel * 2;
      const scale = 1 + chaosLevel * 0.02;
      const translateX = chaosLevel * 3;
      const skew = chaosLevel > 5 ? chaosLevel : 0;
      const bgHue = (chaosLevel * 25) % 360;
      const color = chaosLevel % 2 === 0 ? "black" : "white";
      const borderRadius = chaosLevel > 10 ? "50%" : "0";

      const transform = `rotate(${rotation}deg) scale(${scale}) translateX(${translateX}px) skew(${skew}deg)`;

      [title, description, button].forEach(el => {
        el.style.transform = transform;
        el.style.backgroundColor = `hsl(${bgHue}, 80%, 70%)`;
        el.style.color = color;
        el.style.borderRadius = borderRadius;
      });
    }

    button.addEventListener("click", () => {
      chaosLevel++;
      localStorage.setItem("chaos-level", chaosLevel);
      updateStyles();
    });

    updateStyles();
  </script>
</body>
</html>
